persona:
  name: "Leonardo Isleño"
  company: "El Mundo Celular"
  role: "Desarrollador / Dueño"
  email: "leo@tudominio.com"   # solo para que no falle el config; no vas a enviar
  linkedin: ""                 # requerido por el schema (persona.linkedin); vacio a proposito
  tone: "directo, de colega a colega, sin vender humo"

product:
  name: "Sistema de gestión para locales de celulares"
  description: >
    Sistema web de gestión para locales de venta y reparación de celulares.
    Maneja ingreso de equipos a reparación con estados, stock, clientes,
    ventas y caja. Incluye avisos automáticos por WhatsApp al cliente cuando
    el equipo cambia de estado o está listo para retirar. Hecho por alguien
    que tiene un local de celulares y lo usa todos los días.
  pricing: "Plan básico $60.000 ARS/mes. Plan con WhatsApp Meta y facturación AFIP $80.000 ARS/mes."
  key_benefits:
    - "Saber en qué estado está cada equipo sin revisar un cuaderno"
    - "El cliente recibe el aviso por WhatsApp solo, sin que vos lo escribas"
    - "Stock y caja en el mismo lugar que las reparaciones"
    - "Nada de instalar nada: entrás desde el navegador del local o del celular"
  # El schema pide un mapa objecion -> respuesta, no una lista. Son tus tres
  # textos tal cual, partidos en la flecha que ya habias escrito.
  objection_responses:
    "Ya uso Excel / cuaderno": "El problema no es anotar, es buscar. Te muestro una reparación de hace 3 meses en 2 segundos."
    "Es caro": "Es menos que un cambio de pantalla por mes."
    "No tengo tiempo de aprenderlo": "La migración y la carga inicial la hago yo."
  # El schema pide un objeto, no un string. Tu frase quedo en `entry`.
  # Nada de esto se usa mientras no corras `harvey run`: lo lee el Writer.
  offer:
    primary: "Plan básico $60.000 ARS/mes; con WhatsApp Meta y facturación AFIP $80.000 ARS/mes."
    entry: "Una demo de 15 minutos sobre tu propio local, sin compromiso."
    goal: "book_call"
    booking_method: "ask_preference"   # no hay calendar link
    booking_url: ""
    meeting_duration: "15 minutes"
    meeting_owner: "Leonardo Isleño"

icp:
  industries:
    - "reparación de celulares"
    - "venta de celulares"
    - "servicio técnico de celulares"
    - "accesorios para celulares"
  titles: ["Dueño", "Propietario", "Titular", "Encargado", "Gerente"]
  company_size: "1-15"
  geography:
    - "Córdoba, Argentina"
    - "Villa Carlos Paz, Córdoba, Argentina"
    - "Río Cuarto, Córdoba, Argentina"
    - "Villa María, Córdoba, Argentina"

channels:
